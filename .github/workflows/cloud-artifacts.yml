name: Verify and package cloud agent
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.1"
      - name: Install OS prerequisites and pinned tools
        env:
          GIT_REVIEW_TOOL_DIR: ${{ runner.temp }}/git-review-tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ca-certificates curl unzip git ripgrep
          bash deploy/install-linux.sh
          printf '%s/bin\n' "$GIT_REVIEW_TOOL_DIR" >> "$GITHUB_PATH"
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - run: bun run qa:check
      - run: bun qa/check-agent-package.ts
      - run: bun qa/check-cloud-agent.ts
      - name: Package independent runtime
        run: tar -czf "$RUNNER_TEMP/git-review-agent.tar.gz" -C dist agent
      - uses: actions/upload-artifact@v4
        with:
          name: git-review-agent
          path: ${{ runner.temp }}/git-review-agent.tar.gz
          if-no-files-found: error

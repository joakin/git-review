name: Deploy static review client
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.1"
      - uses: actions/configure-pages@v5
        id: pages
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run qa:check
      - name: Build at the configured Pages path
        env:
          DEPLOYMENT_BASE: ${{ steps.pages.outputs.base_path || '/' }}
        run: bun run build:web --base-path "$DEPLOYMENT_BASE"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/web
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
